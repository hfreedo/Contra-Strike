"ancho": 950.4, "alto": 633.6}, "Colegio": {"x": 1211.6, "y": 633.6, "ancho": 108.0, "alto": 108.0}}};const stage=document.querySelector('#stage');let current='854x366';function image(src,g,cls=''){return `<img class="layer ${cls}" src="Assets/${src}" alt="" style="left:${g.x}px;top:${g.y}px;width:${g.ancho}px;height:${g.alto}px">`}
function show(key){current=key;const[w,h]=key.split('x').map(Number);const g=positions[key];stage.style.width=w+'px';stage.style.height=h+'px';stage.innerHTML=image('Fondos/fondo_menu_alien.png',g.Fondo)+image('Personaje/explorador_sin_armas.png',g.Personaje,'hero')+image('Titulo/contra_strike.png',g.Titulo,'title')+image('Colegio/logo_colegio_transparente.png',g.Colegio)+`<div class="demo">PC · DEMO ESCOLAR</div><div class="subtitle" style="left:${w*.52}px;top:${h*.34}px;width:${w*.4}px;font-size:${Math.max(9,Math.round(h*.018))}px">UN MUNDO POR DESCUBRIR</div>`;
for(const[name,label,action]of[['Jugar','JUGAR DEMO','jugar'],['ComoJugar','CÓMO JUGAR','ayuda'],['Creditos','CRÉDITOS','creditos']]){const b=g[name];stage.insertAdjacentHTML('beforeend',`<button class="menu-button" data-action="${action}" style="left:${b.x}px;top:${b.y}px;width:${b.ancho}px;height:${b.alto}px;font-size:${Math.max(12,Math.round(h*.034))}px"><img src="Assets/Interfaz/boton_alien_vacio.png" alt=""><span>${label}</span></button>`)}
stage.insertAdjacentHTML('beforeend','<div class="veil" id="veil"></div>');for(const b of stage.querySelectorAll('[data-action]'))b.onclick=()=>panel(b.dataset.action);document.querySelector('#resolution').textContent=key.replace('x',' × ')}
function panel(action){const[w,h]=current.split('x').map(Number);const g=positions[current].Panel;const titles={ayuda:'CÓMO JUGAR',creditos:'CRÉDITOS',jugar:'JUGAR DEMO'};const body={ayuda:'Explora las plataformas de la base alienígena.<br>Flechas izquierda y derecha: moverse.<br>Flecha arriba: saltar.',creditos:'Contra Strike · Un mundo por descubrir.<br>Centro Educativo Privado<br>Centenario Las Palmeras.<br>Autores del grupo: completar por el docente.',jugar:'Esta vista muestra los assets del menú.<br>En Construct 2, conecta este botón<br>con el layout de juego.'};const veil=document.querySelector('#veil');veil.classList.add('open');veil.innerHTML=image('Interfaz/panel_alien_vacio.png',g)+`<div class="panel-body" style="left:${g.x}px;top:${g.y}px;width:${g.ancho*.76}px;height:${g.alto*.70}px;font-size:${Math.max(12,Math.round(h*.03))}px"><h2>${titles[action]}</h2><p>${body[action]}</p><button class="panel-close">VOLVER</button></div>`;veil.querySelector('button').onclick=()=>{veil.classList.remove('open');veil.innerHTML=''}}
